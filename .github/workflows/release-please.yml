name: Release Please

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Release tag to publish (e.g. v0.4.1)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update Release PR
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: always() && (needs.release.outputs.release_created == 'true' || (inputs.publish_tag != '' && inputs.publish_tag != null))
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release.outputs.tag_name }}

      - name: Setup Node.js for OIDC Trusted Publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Ensure Trusted Publishing compatible npm CLI version
        run: npm install --global npm@11.5.1

      - name: Assert Trusted Publishing runtime requirements (Node >= 22.14.0, npm >= 11.5.1)
        run: |
          node --version
          npm --version
          node ./scripts/check-publish-runtime.js

      - name: Setup Python for Compatibility Verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-compat.txt

      - name: Verify immutable action pinning
        run: npm run check:actions

      - name: Audit dependency security
        run: npm run security:audit

      - name: Build and execute test suites
        run: |
          npm run build
          npm test
          npm run test:compat:technicalindicators
          npm run test:compat:python
          npm run bench:regression

      - name: Pack exact release artifact and generate SBOMs
        run: |
          npm pack
          node ./scripts/generate-sbom.js

      - name: Validate exact artifact, payload documentation invariant, SBOMs, and tag alignment
        run: node ./scripts/validate-release-artifact.js --tag=${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release.outputs.tag_name }} --check-npm

      - name: Upload release artifact and SBOM evidence
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts-${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release.outputs.tag_name }}
          path: |
            ta-crypto-*.tgz
            ta-crypto-*.sbom.*.json

      - name: Attach release artifacts and SBOMs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ inputs.publish_tag != '' && inputs.publish_tag || needs.release.outputs.tag_name }}"
          gh release upload "${RELEASE_TAG}" ta-crypto-*.tgz ta-crypto-*.sbom.*.json --clobber

      - name: Publish to npm via OIDC Trusted Publishing
        run: npm publish --access public --provenance
